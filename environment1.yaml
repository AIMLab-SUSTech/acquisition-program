name: acquisition_event1
channels:
  - conda-forge
  - defaults
dependencies:
  # 核心 Python 环境
  - python=3.12

  # 科学计算与图像处理 (对应 numpy, PIL, h5py)
  - numpy
  - h5py
  - pillow
  - scipy  # 虽然代码没直接显式import，但科学计算和硬件控制通常需要它

  # 绘图 (对应 matplotlib)
  - matplotlib
  - matplotlib-base

  # GUI 界面 (对应 code 中的 PyQt6)
  # 注意：代码明确使用了 PyQt6，因此这里指定 PyQt6，并移除会导致冲突的 Qt5 库
  - pyqt=6.9.1
  - qtbase=6.9.2
  - qttools

  # 基础硬件通信接口
  - pyserial
  - pyusb
  - pyvisa

  # Pip 安装 (对应特定硬件驱动)
  - pip
  - pip:
      # IDS uEye 相机驱动
      - pyueye
      
      # Photometrics 相机驱动
      - pyvcam
      
      # 通用硬件控制库 (Newport XPS/SmartAct 等常用)
      - pylablib
      
      # The Imaging Source 相机
      - imagingcontrol4
      
      # 其他工具
      - pyserial
      - pyusb
      - pyvisa
      
      # 注意：已移除 pyqt5 和 pyqtgraph (如有需要请确认是否支持 PyQt6)
      # 如果你的 gui_generate.py 依赖 pyqtgraph，需要安装支持 PyQt6 的版本：
      - pyqtgraph